<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Doğal iç fındık illüstrasyonu">
  <defs>
    <linearGradient id="dogalNut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ddb0"/>
      <stop offset="1" stop-color="#c99f63"/>
    </linearGradient>
    <linearGradient id="dogalNutBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6cd98"/>
      <stop offset="1" stop-color="#b98d52"/>
    </linearGradient>
  </defs>

  <ellipse cx="120" cy="196" rx="78" ry="14" fill="#12352f" opacity="0.12"/>

  <!-- small leaf twig accent -->
  <g transform="translate(150,26) rotate(18)">
    <path d="M0 0 C 14 2 22 14 20 28 C 8 26 -2 14 0 0 Z" fill="#7fa06f"/>
    <path d="M0 0 C 10 6 16 16 18 26" fill="none" stroke="#5c7d4d" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- back nut -->
  <g transform="translate(150,92) rotate(12)">
    <path d="M0 -46 C 22 -46 36 -24 36 -2 C 36 24 20 46 0 46 C -20 46 -36 24 -36 -2 C -36 -24 -22 -46 0 -46 Z" fill="url(#dogalNutBack)"/>
    <path d="M0 -46 C 14 -46 24 -34 30 -18" fill="none" stroke="#f4e5bd" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- front-left nut -->
  <g transform="translate(80,110) rotate(-14)">
    <path d="M0 -50 C 24 -50 39 -26 39 -2 C 39 26 22 50 0 50 C -22 50 -39 26 -39 -2 C -39 -26 -24 -50 0 -50 Z" fill="url(#dogalNut)"/>
    <path d="M0 -50 C 15 -50 26 -37 32 -20" fill="none" stroke="#faf0d5" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M0 -44 C -6 -20 -6 20 0 44" fill="none" stroke="#a97f47" stroke-width="1.6" opacity="0.45"/>
    <ellipse cx="2" cy="40" rx="9" ry="5" fill="#8a6535" opacity="0.5"/>
  </g>

  <!-- front-right nut, slightly forward -->
  <g transform="translate(146,132) rotate(9)">
    <path d="M0 -48 C 23 -48 37 -25 37 -2 C 37 25 21 48 0 48 C -21 48 -37 25 -37 -2 C -37 -25 -23 -48 0 -48 Z" fill="url(#dogalNut)"/>
    <path d="M0 -48 C 14 -48 25 -36 30 -19" fill="none" stroke="#faf0d5" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M0 -42 C -5 -18 -5 18 0 42" fill="none" stroke="#a97f47" stroke-width="1.6" opacity="0.45"/>
    <ellipse cx="1" cy="38" rx="8" ry="4.5" fill="#8a6535" opacity="0.5"/>
  </g>
</svg>
