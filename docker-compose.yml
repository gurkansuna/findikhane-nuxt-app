services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      POSTGRES_CONNECTION_STRING: postgresql://findikhane:findikhane@postgres:5432/findikhane
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: findikhane
      POSTGRES_USER: findikhane
      POSTGRES_PASSWORD: findikhane
    volumes:
      - findikhane-nuxt-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findikhane -d findikhane"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  findikhane-nuxt-db:
